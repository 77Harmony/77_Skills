<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Token Waste Flow</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07080d;color:#eef3ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}.stage{height:100vh;padding:90px 110px;background:radial-gradient(circle at 18% 22%,rgba(64,112,255,.23),transparent 30%),radial-gradient(circle at 85% 75%,rgba(151,72,255,.18),transparent 35%),#07080d}.head{font-size:58px;font-weight:800;margin-bottom:74px}.head span{color:#7fb2ff}.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:24px;align-items:center}.node{min-height:260px;border:1px solid rgba(132,164,255,.28);background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));border-radius:8px;padding:34px 28px;position:relative;opacity:.35;animation:on 8s linear infinite}.node:nth-child(2){animation-delay:1s}.node:nth-child(3){animation-delay:2s}.node:nth-child(4){animation-delay:3s}.node:nth-child(5){animation-delay:4s}.num{font-size:22px;color:#8bb7ff}.txt{font-size:34px;font-weight:750;margin-top:42px;line-height:1.25}.cost{position:absolute;bottom:26px;color:#ff8fb7;font-size:22px}.arrow{position:absolute;right:-22px;top:50%;color:#7fa4ff;font-size:30px}.note{margin-top:64px;font-size:32px;color:#b7c1d8}@keyframes on{0%,70%,100%{opacity:.35;box-shadow:none}12%,46%{opacity:1;box-shadow:0 0 34px rgba(102,142,255,.26)}}
</style>
</head>
<body><main class="stage"><div class="head">Token 浪费链路：<span>不是一次发生</span></div><section class="flow"><div class="node"><div class="num">01</div><div class="txt">用户大任务</div><div class="cost">目标过宽</div><div class="arrow">→</div></div><div class="node"><div class="num">02</div><div class="txt">全项目扫描</div><div class="cost">上下文变大</div><div class="arrow">→</div></div><div class="node"><div class="num">03</div><div class="txt">高推理</div><div class="cost">计算成本上升</div><div class="arrow">→</div></div><div class="node"><div class="num">04</div><div class="txt">反复执行</div><div class="cost">试错成本叠加</div><div class="arrow">→</div></div><div class="node"><div class="num">05</div><div class="txt">Token 浪费</div><div class="cost">额度快速消耗</div></div></section><div class="note">先收窄任务，再让 Codex 开始执行。</div></main></body>
</html>
