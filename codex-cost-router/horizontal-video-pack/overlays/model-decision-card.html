<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Model Decision</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07080d;color:#eef3ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}.stage{height:100vh;padding:88px 110px;background:radial-gradient(circle at 50% 20%,rgba(99,127,255,.2),transparent 36%),#07080d}.title{font-size:58px;font-weight:820;margin-bottom:58px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}.card{height:520px;border:1px solid rgba(139,183,255,.32);border-radius:8px;padding:36px;background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.028));animation:float 4s ease-in-out infinite}.card:nth-child(2){animation-delay:.4s}.card:nth-child(3){animation-delay:.8s}.tier{font-size:46px;font-weight:850;background:linear-gradient(90deg,#78b7ff,#b983ff);-webkit-background-clip:text;color:transparent}.desc{font-size:28px;color:#c9d2e8;margin-top:24px;line-height:1.45}.tag{display:inline-block;margin-top:38px;padding:12px 18px;border:1px solid rgba(126,178,255,.38);border-radius:999px;color:#9fc5ff;font-size:22px}.list{margin-top:48px;display:grid;gap:18px;font-size:24px;color:#dfe6f6}.list div:before{content:"";display:inline-block;width:8px;height:8px;background:#8bb7ff;border-radius:50%;margin-right:12px}@keyframes float{50%{transform:translateY(-10px);box-shadow:0 0 38px rgba(105,142,255,.16)}}
</style>
</head>
<body><main class="stage"><div class="title">模型分层：不是越强越好</div><section class="cards"><div class="card"><div class="tier">Mini</div><div class="desc">轻量任务、文案、单文件小改动。</div><div class="tag">低成本优先</div><div class="list"><div>低推理</div><div>小上下文</div><div>快速确认</div></div></div><div class="card"><div class="tier">5.4</div><div class="desc">中等开发任务、局部模块分析、常规修复。</div><div class="tag">平衡档</div><div class="list"><div>中等推理</div><div>限定文件</div><div>分步执行</div></div></div><div class="card"><div class="tier">5.5</div><div class="desc">高风险重构、复杂架构判断、跨模块改造。</div><div class="tag">谨慎使用</div><div class="list"><div>高推理</div><div>先只读分析</div><div>严格权限</div></div></div></section></main></body>
</html>
