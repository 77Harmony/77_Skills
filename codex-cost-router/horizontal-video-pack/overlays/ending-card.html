<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ending</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#06070b;color:#f2f6ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}.stage{height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,rgba(110,168,255,.26),transparent 28%),radial-gradient(circle at 60% 72%,rgba(185,131,255,.18),transparent 28%),#06070b}.ring{position:absolute;width:720px;height:720px;border:1px solid rgba(139,183,255,.15);border-radius:50%;animation:spin 18s linear infinite}.ring:after{content:"";position:absolute;inset:70px;border:1px solid rgba(185,131,255,.18);border-radius:50%}.text{text-align:center;animation:rise 1.2s ease both}.main{font-size:104px;font-weight:900;line-height:1.08;background:linear-gradient(90deg,#7eb8ff,#c49aff);-webkit-background-clip:text;color:transparent}.sub{margin-top:34px;font-size:34px;color:#c2cbe0}.line{width:520px;height:3px;margin:40px auto;background:linear-gradient(90deg,transparent,#7eb8ff,#c49aff,transparent)}@keyframes spin{to{transform:rotate(360deg)}}@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
</style>
</head>
<body><main class="stage"><div class="ring"></div><section class="text"><div class="main">先路由<br>再执行</div><div class="line"></div><div class="sub">把路径、权限和预算先框出来</div></section></main></body>
</html>
