<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Intro Title</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#06070b;color:#eef3ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}.stage{width:100vw;height:100vh;aspect-ratio:16/9;display:grid;place-items:center;background:radial-gradient(circle at 20% 15%,rgba(89,117,255,.25),transparent 30%),radial-gradient(circle at 80% 70%,rgba(164,88,255,.2),transparent 32%),linear-gradient(135deg,#06070b,#111522)}.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(to bottom,transparent,#000 20%,#000 80%,transparent)}.card{text-align:center;animation:rise 1.2s ease both}.eyebrow{color:#8bb7ff;font-size:28px;letter-spacing:.08em;margin-bottom:26px}.title{font-size:86px;font-weight:800;line-height:1.08}.title span{background:linear-gradient(90deg,#6ea8ff,#b983ff);-webkit-background-clip:text;color:transparent}.sub{margin-top:28px;font-size:34px;color:#b8c3d9}.bar{width:420px;height:3px;margin:34px auto 0;background:linear-gradient(90deg,transparent,#6ea8ff,#b983ff,transparent);animation:pulse 2s ease-in-out infinite}@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}@keyframes pulse{50%{filter:drop-shadow(0 0 18px #8aa8ff)}}
</style>
</head>
<body><main class="stage"><div class="grid"></div><section class="card"><div class="eyebrow">CODEX COST ROUTER</div><div class="title">Codex 额度<br><span>为什么烧这么快？</span></div><div class="sub">因为新手常常没有先做任务路由</div><div class="bar"></div></section></main></body>
</html>
